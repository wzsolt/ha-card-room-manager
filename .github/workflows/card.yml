name: Validate

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Run browser tests with the runner's Chrome
        run: |
          chrome="$(command -v google-chrome)"
          "$chrome" --version
          ROOM_MANAGER_CHROMIUM="$chrome" npm run test:browser
